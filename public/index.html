<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f4eb">
  <title>Hygienic Food Application</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
      color: #171914;
      background: #f7f4eb;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scrollbar-width: none;
    }

    html::-webkit-scrollbar {
      display: none;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      display: grid;
      grid-template-rows: 1fr auto;
      background:
        linear-gradient(rgba(250, 248, 241, 0.28), rgba(250, 248, 241, 0.28)),
        url("background.png") center / cover fixed;
    }

    main {
      display: grid;
      place-items: center;
      padding: 52px 20px 32px;
    }

    .auth-card {
      width: min(100%, 600px);
      padding: 28px 24px 32px;
      text-align: center;
    }

    .brand-name {
      margin: 2px 0 0;
      color: #152633;
      font-size: clamp(22px, 3.5vw, 32px);
      font-weight: 400;
      line-height: 1.35;
    }

    .telugu {
      margin: 0 0 4px;
      color: #111111;
      font-size: clamp(34px, 6vw, 58px);
      font-weight: 700;
      line-height: 1.6;
    }

    .auth-tabs {
      display: flex;
      justify-content: center;
      gap: clamp(38px, 8vw, 76px);
      width: min(100%, 470px);
      margin: 38px auto 30px;
    }

    .tab {
      position: relative;
      padding: 0 12px 12px;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      color: #64717d;
      font-size: 20px;
      font-weight: 600;
      cursor: pointer;
    }

    .tab[aria-selected="true"] {
      color: #19965a;
      font-weight: 700;
    }

    .auth-form {
      display: none;
      flex-direction: column;
      gap: 30px;
      text-align: left;
    }

    .auth-form.is-active {
      display: flex;
    }

    .field {
      position: relative;
      display: block;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      clip-path: inset(50%);
    }

    input,
    .input-field {
      width: 100%;
      box-sizing: border-box;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: #17232b;
      padding: 12px 40px;
      font: inherit;
      font-size: 18px;
    }

    input::placeholder,
    .input-field::placeholder {
      color: #737e89;
      opacity: 1;
    }

    input:focus,
    .input-field:focus {
      border-bottom: 1px solid #171914;
      outline: none;
    }

    .input-icon {
      position: absolute;
      top: 50%;
      left: 8px;
      width: 20px;
      height: 20px;
      color: #000000;
      stroke: #000000;
      pointer-events: none;
      transform: translateY(-50%);
    }

    .password-toggle {
      position: absolute;
      top: 50%;
      right: 4px;
      display: grid;
      width: 32px;
      height: 32px;
      padding: 0;
      place-items: center;
      border: 0;
      background: transparent;
      color: #000000;
      cursor: pointer;
      transform: translateY(-50%);
    }

    .password-toggle svg {
      width: 20px;
      height: 20px;
      stroke: #000000;
    }

    .password-toggle:focus-visible {
      outline: 2px solid #000000;
      outline-offset: 2px;
    }

    .submit-button {
      display: grid;
      width: 48px;
      min-width: 110px;
      height: 54px;
      margin: 8px auto 0;
      place-items: center;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: #19965a;
      font: inherit;
      font-size: 30px;
      font-weight: 700;
      cursor: pointer;
      transition: color 180ms ease;
    }

    .submit-button:hover {
      color: #117743;
    }

    .submit-button:focus-visible,
    .tab:focus-visible {
      outline: 2px solid #171914;
      outline-offset: 4px;
    }

    .form-message {
      min-height: 20px;
      margin: 0;
      color: #33372b;
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
    }

    .account-switch {
      margin: 12px 0 0;
      color: #152633;
      font-size: 18px;
    }

    .inline-link {
      padding: 0;
      border: 0;
      background: none;
      color: #19965a;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }

    .inline-link:hover {
      color: #117743;
      text-decoration: underline;
    }

    footer {
      padding: 14px 16px 18px;
      color: rgba(23, 25, 20, 0.86);
      font-size: 11px;
      text-align: center;
    }

    @media (max-width: 480px) {
      main {
        padding: 30px 16px 22px;
      }

      .auth-tabs {
        margin-top: 26px;
      }

      .auth-form {
        gap: 24px;
      }

      .account-switch {
        font-size: 15px;
      }
    }

    @media (max-height: 760px) {
      main {
        padding-top: 12px;
        padding-bottom: 12px;
      }

      .auth-card {
        padding-top: 10px;
        padding-bottom: 10px;
      }

      .telugu {
        font-size: clamp(32px, 5vw, 44px);
        line-height: 1.25;
      }

      .brand-name {
        font-size: clamp(19px, 3vw, 25px);
      }

      .auth-tabs {
        margin-top: 20px;
        margin-bottom: 18px;
      }

      .auth-form {
        gap: 17px;
      }

      input,
      .input-field {
        padding-top: 8px;
        padding-bottom: 8px;
      }

      .submit-button {
        height: 42px;
        margin-top: 0;
        font-size: 25px;
      }

      .account-switch {
        margin-top: 4px;
        font-size: 15px;
      }

      footer {
        padding-top: 6px;
        padding-bottom: 8px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="auth-card" aria-label="Hygienic Food account access">
      <h1 class="telugu" lang="te">ఆరోగ్యమే మహా భాగ్యం</h1>
      <p class="brand-name">Hygienic Food Application</p>

      <div class="auth-tabs" role="tablist" aria-label="Account access">
        <button class="tab" id="login-tab" type="button" role="tab" aria-selected="true" aria-controls="login-panel">Login</button>
        <button class="tab" id="register-tab" type="button" role="tab" aria-selected="false" aria-controls="register-panel" tabindex="-1">Register</button>
      </div>

      <form class="auth-form is-active" id="login-panel" role="tabpanel" aria-labelledby="login-tab">
        <div class="field">
          <label class="visually-hidden" for="login-username">Username or Email</label>
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="8" r="4"></circle><path d="M5 21v-2a7 7 0 0 1 14 0v2z"></path>
          </svg>
          <input class="input-field" id="login-username" name="username" type="text" placeholder="Username" autocomplete="username" required>
        </div>
        <div class="field">
          <label class="visually-hidden" for="login-password">Password</label>
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="4" y="10" width="16" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 1 1 8 0v3"></path><circle cx="12" cy="15.5" r="1"></circle><path d="M12 16.5v2"></path>
          </svg>
          <input class="input-field" id="login-password" name="password" type="password" placeholder="Password" autocomplete="current-password" required>
          <button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
        <button class="submit-button" type="submit" aria-label="Login">Login</button>
        <p class="form-message" aria-live="polite"></p>
      </form>
      <p class="account-switch" id="login-switch">Don't have an account? <button class="inline-link" id="switch-to-register" type="button">Register</button></p>

      <form class="auth-form" id="register-panel" role="tabpanel" aria-labelledby="register-tab" hidden>
        <div class="field">
          <label class="visually-hidden" for="register-username">Username</label>
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="8" r="4"></circle><path d="M5 21v-2a7 7 0 0 1 14 0v2z"></path>
          </svg>
          <input class="input-field" id="register-username" name="username" type="text" placeholder="Username" autocomplete="username" required>
        </div>
        <div class="field">
          <label class="visually-hidden" for="register-email">Email</label>
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m3 7 9 6 9-6"></path>
          </svg>
          <input class="input-field" id="register-email" name="email" type="email" placeholder="Email" autocomplete="email" required>
        </div>
        <div class="field">
          <label class="visually-hidden" for="register-password">Password</label>
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="4" y="10" width="16" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 1 1 8 0v3"></path><circle cx="12" cy="15.5" r="1"></circle><path d="M12 16.5v2"></path>
          </svg>
          <input class="input-field" id="register-password" name="password" type="password" placeholder="Password" autocomplete="new-password" required>
          <button class="password-toggle" type="button" aria-label="Show password" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
        <div class="field">
          <label class="visually-hidden" for="register-confirm-password">Confirm Password</label>
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="4" y="10" width="16" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 1 1 8 0v3"></path><circle cx="12" cy="15.5" r="1"></circle><path d="M12 16.5v2"></path>
          </svg>
          <input class="input-field" id="register-confirm-password" name="confirmPassword" type="password" placeholder="Confirm Password" autocomplete="new-password" required>
          <button class="password-toggle" type="button" aria-label="Show confirm password" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
        <button class="submit-button" type="submit" aria-label="Create account">Register</button>
        <p class="form-message" aria-live="polite"></p>
      </form>
      <p class="account-switch" id="register-switch" hidden>Already have an account? <button class="inline-link" id="switch-to-login" type="button">Login</button></p>
    </section>
  </main>

  <footer>© 2025 Hygienic Food Application. All Rights Reserved.</footer>
  <script type="module" src="auth.js"></script>
</body>
</html>
