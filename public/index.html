<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hygenic Food Application</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(rgba(255,255,255,0.25), rgba(255,255,255,0.25)), url('background.png') no-repeat center center/cover;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      color: black;
      text-align: center;
      overflow: hidden;
    }

    h2 {
      margin: 5px 0;
      font-size: 2.2em;
      color: black;
      animation: fadeInDown 1.5s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .auth-container {
      width: 100%;
      max-width: 350px;
      margin-top: 20px;
      animation: fadeIn 2s ease-in-out;
    }

    .tab-buttons {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 20px;
    }

    .tab-buttons button {
      background: transparent;
      border: none;
      font-size: 1em;
      cursor: pointer;
      color: black;
      border-bottom: 2px solid transparent;
      transition: 0.3s;
    }

    .tab-buttons button.active {
      border-bottom: 2px solid black;
      font-weight: bold;
    }

    form {
      display: none;
      flex-direction: column;
      align-items: center;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.6s ease-in-out;
    }

    form.active {
      display: flex;
      opacity: 1;
      transform: translateY(0);
    }

    input {
      width: 100%;
      margin: 12px 0;
      padding: 10px 5px;
      background: transparent;
      border: none;
      border-bottom: 1px solid black;
      outline: none;
      font-size: 14px;
      color: black;
    }

    input::placeholder {
      color: rgba(0,0,0,0.6);
    }

    .circle-btn {
      margin-top: 20px;
      width: 50px;
      height: 50px;
      border: 1px solid black;
      border-radius: 50%;
      background: transparent;
      color: black;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: 0.3s;
    }

    .circle-btn:hover {
      background: rgba(0,0,0,0.1);
      transform: scale(1.1);
    }

    .profile-container {
      display: none;
      text-align: center;
      margin-top: 30px;
      color: black;
      animation: fadeIn 1.5s ease-in-out;
    }

    .logout-btn {
      margin-top: 20px;
      padding: 10px 20px;
      border: 1px solid black;
      background: transparent;
      color: black;
      cursor: pointer;
      border-radius: 5px;
      transition: 0.3s;
    }

    .logout-btn:hover {
      background: rgba(0,0,0,0.1);
    }

    footer {
      position: fixed;
      bottom: 10px;
      width: 100%;
      text-align: center;
      font-size: 12px;
      color: black;
      animation: fadeIn 3s ease-in-out;
    }
  </style>
</head>
<body>

  <h2>"When in doubt, throw it out."</h2>
  <h2>ఆరోగ్యమే మహా భాగ్యం</h2>

  <div class="auth-container" id="auth-section">
    <div class="tab-buttons">
      <button class="tab-link active" onclick="openTab(event, 'login')">Login</button>
      <button class="tab-link" onclick="openTab(event, 'register')">Register</button>
    </div>

    <form id="login" class="active" onsubmit="return handleLogin(event)">
      <input type="text" id="login-username" placeholder="Username or Email" required>
      <input type="password" id="login-password" placeholder="Password" required>
      <button type="submit" class="circle-btn">→</button>
    </form>

    <form id="register" onsubmit="return handleRegister(event)">
      <input type="text" id="reg-name" placeholder="Full Name" required>
      <input type="email" id="reg-email" placeholder="Email" required>
      <input type="text" id="reg-username" placeholder="Username" required>
      <input type="password" id="reg-password" placeholder="Password" required>
      <input type="password" id="reg-confirm" placeholder="Confirm Password" required>
      <button type="submit" class="circle-btn">→</button>
    </form>
  </div>

  <div class="profile-container" id="profile-section">
    <h1 id="welcome-message">Welcome!</h1>
    <p><strong>Full Name:</strong> <span id="profile-name"></span></p>
    <p><strong>Email:</strong> <span id="profile-email"></span></p>
    <p><strong>Username:</strong> <span id="profile-username"></span></p>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>

  <footer>
    © 2025 Hygienic Food Application. All Rights Reserved.
  </footer>

  <script>
    const AUTH_KEY = 'hygienicFoodUser';

    function openTab(evt, tabName) {
      let forms = document.querySelectorAll("form");
      forms.forEach(form => form.classList.remove("active"));

      let tablinks = document.querySelectorAll(".tab-link");
      tablinks.forEach(btn => btn.classList.remove("active"));

      const targetForm = document.getElementById(tabName);
      if (targetForm) targetForm.classList.add("active");
      if (evt && evt.currentTarget) evt.currentTarget.classList.add("active");
    }

    function saveUser(user) {
      localStorage.setItem(AUTH_KEY, JSON.stringify(user));
    }

    function getSavedUser() {
      const user = localStorage.getItem(AUTH_KEY);
      return user ? JSON.parse(user) : null;
    }

    function clearSavedUser() {
      localStorage.removeItem(AUTH_KEY);
    }

    async function handleRegister(event) {
      event.preventDefault();
      let name = document.getElementById("reg-name").value.trim();
      let email = document.getElementById("reg-email").value.trim();
      let username = document.getElementById("reg-username").value.trim();
      let password = document.getElementById("reg-password").value;
      let confirm = document.getElementById("reg-confirm").value;

      if (!name || !email || !username || !password) {
        alert("Please fill in all fields.");
        return false;
      }

      if (password !== confirm) {
        alert("Passwords do not match!");
        return false;
      }

      try {
        let response = await fetch("/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name, email, username, password })
        });

        if (!response.ok) {
          throw new Error("Server not available");
        }

        let data = await response.json();
        alert(data.message || "Registration successful!");
        if (data.success) {
          openTab({ currentTarget: document.querySelector(".tab-link") }, "login");
        }
        return;
      } catch (error) {
        const user = { name, email, username, password };
        saveUser(user);
        alert("Registration successful! (Demo mode)");
        document.getElementById("register").reset();
        openTab({ currentTarget: document.querySelectorAll(".tab-link")[0] }, "login");
      }
    }

    async function handleLogin(event) {
      event.preventDefault();
      let username = document.getElementById("login-username").value.trim();
      let password = document.getElementById("login-password").value;

      if (!username || !password) {
        alert("Please enter username and password.");
        return false;
      }

      try {
        let response = await fetch("/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });

        if (!response.ok) {
          throw new Error("Server not available");
        }

        let data = await response.json();

        if (!data.success) {
          alert(data.message || "Login failed.");
          return false;
        }

        let user = data.user;
        saveUser(user);
        showProfile(user);
        return;
      } catch (error) {
        const savedUser = getSavedUser();

        if (savedUser && ((savedUser.username === username && savedUser.password === password) || (savedUser.email === username && savedUser.password === password))) {
          showProfile(savedUser);
          return;
        }

        alert("Login failed. Please register first or check your username/password.");
      }
    }

    function showProfile(user) {
      document.querySelector(".auth-container").style.display = "none";
      document.getElementById("profile-section").style.display = "block";
      document.getElementById("welcome-message").innerText = "Welcome, " + user.name;
      document.getElementById("profile-name").innerText = user.name;
      document.getElementById("profile-email").innerText = user.email;
      document.getElementById("profile-username").innerText = user.username;
    }

    function logout() {
      clearSavedUser();
      document.querySelector(".auth-container").style.display = "block";
      document.getElementById("profile-section").style.display = "none";
      document.getElementById("login").reset();
      document.getElementById("register").reset();
      openTab({ currentTarget: document.querySelectorAll(".tab-link")[0] }, "login");
    }
  </script>
</body>
</html>
