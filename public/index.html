<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f4eb">
  <title>Hygienic Food Application</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
      color: #171914;
      background: #f7f4eb;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      display: grid;
      grid-template-rows: 1fr auto;
      background:
        linear-gradient(rgba(250, 248, 241, 0.62), rgba(250, 248, 241, 0.62)),
        url("background.png") center / cover fixed;
    }

    main {
      display: grid;
      place-items: center;
      padding: 52px 20px 32px;
    }

    .auth-card {
      width: min(100%, 420px);
      padding: 38px 42px 40px;
      border: 1px solid rgba(23, 25, 20, 0.78);
      background: rgba(250, 249, 244, 0.88);
      box-shadow: 0 18px 60px rgba(24, 26, 18, 0.12);
      text-align: center;
      animation: arrive 650ms ease both;
    }

    .brand-mark {
      display: grid;
      width: 38px;
      height: 38px;
      margin: 0 auto 12px;
      place-items: center;
      border: 1px solid currentColor;
      border-radius: 50%;
      font-size: 19px;
      line-height: 1;
    }

    .brand-name {
      margin: 0;
      font-size: 11px;
      font-weight: 650;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .quote {
      margin: 26px 0 9px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(22px, 5vw, 28px);
      font-weight: 400;
      line-height: 1.25;
    }

    .telugu {
      margin: 0;
      font-size: 17px;
      line-height: 1.6;
    }

    .auth-tabs {
      display: flex;
      justify-content: center;
      gap: 36px;
      margin: 30px 0 22px;
      border-bottom: 1px solid rgba(23, 25, 20, 0.2);
    }

    .tab {
      position: relative;
      padding: 0 2px 11px;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      font-size: 14px;
      cursor: pointer;
    }

    .tab::after {
      position: absolute;
      right: 0;
      bottom: -1px;
      left: 0;
      height: 2px;
      background: currentColor;
      content: "";
      transform: scaleX(0);
      transition: transform 180ms ease;
    }

    .tab[aria-selected="true"] {
      font-weight: 650;
    }

    .tab[aria-selected="true"]::after {
      transform: scaleX(1);
    }

    .auth-form {
      display: none;
      flex-direction: column;
      gap: 19px;
      text-align: left;
    }

    .auth-form.is-active {
      display: flex;
      animation: arrive 260ms ease both;
    }

    .field {
      display: block;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      clip-path: inset(50%);
    }

    .field input {
      width: 100%;
      padding: 11px 1px 10px;
      border: 0;
      border-bottom: 1px solid rgba(23, 25, 20, 0.65);
      border-radius: 0;
      outline: none;
      background: transparent;
      color: inherit;
      font: inherit;
      font-size: 14px;
      transition: border-color 180ms ease, box-shadow 180ms ease;
    }

    .field input::placeholder {
      color: rgba(23, 25, 20, 0.66);
      opacity: 1;
    }

    .field input:focus {
      border-color: #171914;
      box-shadow: 0 1px 0 #171914;
    }

    .submit-button {
      display: grid;
      width: 48px;
      height: 48px;
      margin: 5px auto 0;
      place-items: center;
      border: 1px solid #171914;
      border-radius: 50%;
      background: transparent;
      color: inherit;
      font: inherit;
      font-size: 22px;
      cursor: pointer;
      transition: color 180ms ease, background 180ms ease, transform 180ms ease;
    }

    .submit-button:hover {
      transform: translateX(2px);
      background: #171914;
      color: #faf9f4;
    }

    .submit-button:focus-visible,
    .tab:focus-visible {
      outline: 2px solid #171914;
      outline-offset: 4px;
    }

    .form-message {
      min-height: 20px;
      margin: 0;
      color: #33372b;
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
    }

    footer {
      padding: 14px 16px 18px;
      color: rgba(23, 25, 20, 0.86);
      font-size: 11px;
      text-align: center;
    }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
      main {
        padding: 30px 16px 22px;
      }

      .auth-card {
        padding: 32px 26px 34px;
      }

      .auth-tabs {
        margin-top: 25px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="auth-card" aria-label="Hygienic Food account access">
      <div class="brand-mark" aria-hidden="true">✳</div>
      <p class="brand-name">Hygienic Food</p>
      <h1 class="quote">“When in doubt, throw it out.”</h1>
      <p class="telugu" lang="te">ఆరోగ్యమే మహా భాగ్యం</p>

      <div class="auth-tabs" role="tablist" aria-label="Account access">
        <button class="tab" id="login-tab" type="button" role="tab" aria-selected="true" aria-controls="login-panel">Login</button>
        <button class="tab" id="register-tab" type="button" role="tab" aria-selected="false" aria-controls="register-panel" tabindex="-1">Register</button>
      </div>

      <form class="auth-form is-active" id="login-panel" role="tabpanel" aria-labelledby="login-tab">
        <label class="field">
          <span class="visually-hidden">Username or Email</span>
          <input name="username" type="text" placeholder="Username or Email" autocomplete="username" required>
        </label>
        <label class="field">
          <span class="visually-hidden">Password</span>
          <input name="password" type="password" placeholder="Password" autocomplete="current-password" required>
        </label>
        <button class="submit-button" type="submit" aria-label="Continue to login">→</button>
        <p class="form-message" aria-live="polite"></p>
      </form>

      <form class="auth-form" id="register-panel" role="tabpanel" aria-labelledby="register-tab" hidden>
        <label class="field">
          <span class="visually-hidden">Username</span>
          <input name="username" type="text" placeholder="Username" autocomplete="username" required>
        </label>
        <label class="field">
          <span class="visually-hidden">Email</span>
          <input name="email" type="email" placeholder="Email" autocomplete="email" required>
        </label>
        <label class="field">
          <span class="visually-hidden">Password</span>
          <input name="password" type="password" placeholder="Password" autocomplete="new-password" required>
        </label>
        <label class="field">
          <span class="visually-hidden">Confirm Password</span>
          <input name="confirmPassword" type="password" placeholder="Confirm Password" autocomplete="new-password" required>
        </label>
        <button class="submit-button" type="submit" aria-label="Continue to registration">→</button>
        <p class="form-message" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <footer>© 2025 Hygienic Food Application. All Rights Reserved.</footer>
  <script type="module" src="auth.js"></script>
</body>
</html>
